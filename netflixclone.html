<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>netflix clone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer"> 
    <link rel="stylesheet" href="/htmlcss/netflixclone.css">
</head>
<body>
    <div class="navbar">
        <div class="nav-logo">
            <div class="logo"></div>
 </div>
 <div class="navbar-ops">
    <p>TV Shows</p>
    <p>Movies</p>
    <p>Recently Added</p>
    <p>My List</p>
 </div>
 <div class="search-icon">
    <i class="fa-solid fa-magnifying-glass"></i>
 </div>
 </div>
  <div class="hero-section">
    <h1 class="main-heading">
        <span>STRANGER</span>   
        <span>THINGS </span>
    </h1>
    <p class="extra-text"> 
        <span> When a Young Boy Vanishes,a small town uncovers</span>
        <span>  a mystery invloving secret experiments ,terrifying</span> 
        <span> supernatural forces and a strange little girl.</span>
        </p>
        <div class="play-buttons"> 
        <button class="play-button">
              <i class="fa-solid fa-play"></i>
            Play
        </button>
        <button class="my-list">
         <i class="fa-solid fa-plus"></i>
            My-List
        </button>
    </div>
    <div class="popular"> 
    <p>Popular On Netflix</p>
    </div>
   
    <div class="series-section">
        
        <div class="image1"></div>
        <div class="image2"></div>
        <div class="image3"></div>
        <div class="image4"></div>
        <div class="image5"></div>
        <div class="image6"></div>
        <div class="image7"></div>
        <div class="image8"></div>
        
    </div>



     

</div>
     
</body>
</html>
